name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
      submodules: recursive 

    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

    - name: Build
      run: make -C Software/STM32/OFH-App-Proto/ -j4
